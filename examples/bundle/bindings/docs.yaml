# A binding is a saved composition: the profile it boots, the parts merged onto
# it, the skills the boot directory carries, and a default scope. Every key but
# `profile` is optional — eng.yaml beside this one is the two-line form.
#
# `cairn boot engineer --with docs-only --scope cairn --save-as docs` writes
# exactly this file, minus these comments. `cairn boot docs` replays it.
#
# `skills:` takes the same ids `--skill` does, in the same shape as `parts:`.
# There is none here because engineer and docs-only already declare the only
# skill this bundle ships — a stable role's skills belong in its profile or in
# a part, and the binding field is for the ones a launch chose.
profile: engineer
parts:
  - docs-only
scope: cairn
